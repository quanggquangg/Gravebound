<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gravebound · Animation Preview</title>
<style>*{box-sizing:border-box}body{margin:0;background:#11151d;color:#eee8db;font:15px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{color:#a7acb9}section{display:flex;gap:16px;flex-wrap:wrap;margin:20px 0}label{display:grid;gap:6px}select,button{background:#252c39;color:#eee8db;border:1px solid #596172;border-radius:8px;padding:10px}canvas{width:100%;height:480px;background:radial-gradient(ellipse,#252d39,#11151d);border:1px solid #343c49;border-radius:12px}input{accent-color:#cfb272}a{color:#e2c488}</style>
<main><h1>GRAVEBOUND / Animation Preview</h1><p>Xem động tác riêng ở kích thước lớn. <a href="index.html">Mở bản game đầy đủ →</a></p>
<section><label>Vũ khí<select id="weapon"></select></label><label>Động tác<select id="motion"><option value="idle">Đứng</option><option value="walk">Đi</option><option value="run">Chạy</option><option value="slash">Chém ngang</option><option value="overhead">Bổ xuống</option><option value="thrust">Đâm</option><option value="dash">Lao đòn</option><option value="spin">Xoay chém</option><option value="bow">Bắn cung</option><option value="roll">Lăn né</option><option value="back">Nhảy lùi</option><option value="guard">Đỡ</option><option value="deflect">Gạt đòn</option><option value="hurt">Trúng đòn</option><option value="cast">Niệm phép</option><option value="drink">Uống bình</option><option value="throw">Ném</option><option value="mount">Lên ngựa</option><option value="dead">Chết</option></select></label><label>Cách cầm<select id="grip"><option value="2">Hai tay</option><option value="1">Một tay</option></select></label><label>Tốc độ<select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option></select></label><label>Hướng nhìn<input id="facing" type="range" min="-3.14" max="3.14" step="0.01" value="-0.5"></label><label>Hướng bước<input id="direction" type="range" min="-3.14" max="3.14" step="0.01" value="0"></label></section>
<canvas id="preview" width="1100" height="480"></canvas><section><button id="pause">Tạm dừng</button><label style="flex:1">Tiến độ<input id="scrub" type="range" min="0" max="1" step="0.001" value="0"></label><span id="status"></span></section><p>Thời lượng ở đây dùng để xem tư thế. Trong game, mỗi vũ khí vẫn dùng thời gian và dữ liệu đòn đánh riêng. Cung luôn cầm hai tay.</p></main>
<script>
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a),sk=x=>x;
function angDiff(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d< -Math.PI)d+=TAU;return d;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
let ctx=document.getElementById('preview').getContext('2d');const UI={grace:{hidden:true}},menuAt='';
</script>
<script src="src/data.js"></script><script src="src/state.js"></script><script src="src/player-animation.js"></script><script src="src/render.js"></script><script src="src/fx.js"></script>
<script>
const el=id=>document.getElementById(id),we=el('weapon'),mo=el('motion');
Object.entries(WEAPONS).filter(([k,w])=>w.look).forEach(([k,w])=>we.add(new Option(w.name,k)));we.value='greatsword';
let playing=true,elapsed=0,previous=0,currentAttack=null;
function reset(){elapsed=0;P._visual=null;P._mv=0;P._ax=P._ay=0;currentAttack={anim:mo.value,wind:.32,act:.24,rec:.44,swing:1,kind:'heavy'};}
for(const id of ['weapon','motion','grip'])el(id).onchange=reset;
el('pause').onclick=()=>{playing=!playing;el('pause').textContent=playing?'Tạm dừng':'Tiếp tục';};
el('scrub').oninput=()=>{playing=false;el('pause').textContent='Tiếp tục';elapsed=+el('scrub').value*duration();P._visual=null;};
function duration(){return mo.value==='dead'?2.2:mo.value==='roll'||mo.value==='back'?0.6:mo.value==='hurt'?0.55:mo.value==='throw'?0.4:mo.value==='mount'?0.3:mo.value==='deflect'?0.42:1;}
reset();
function frame(now){const dt=previous?Math.min(.05,(now-previous)/1000)*+el('speed').value:0;previous=now;const dur=duration();if(playing){elapsed+=dt;if(elapsed>dur){elapsed%=dur;P._visual=null;}G.clock+=dt;}
 const name=mo.value,attack=['slash','overhead','thrust','dash','spin','bow'].includes(name),walking=name==='walk'||name==='run';
 S.equipped=we.value;S.armor='knightset';S.twoH=el('grip').value==='2';P.face=+el('facing').value;P.state=attack?'attack':walking?'idle':name==='back'?'roll':name;P.t=elapsed;P.atk=attack?currentAttack:null;P.sprinting=name==='run';P.mounted=name==='mount';P.spell=null;P.invuln=0;P.flameT=0;P.roll={dur:.6,iframe:[.1,.4],back:name==='back'};P.rollDir=P.face;P.hurtDur=.55;G.deathT=elapsed;
 if(walking&&playing){const a=P.face + +el('direction').value;P.x+=Math.cos(a)*dt*(P.sprinting?200:120);P.y+=Math.sin(a)*dt*(P.sprinting?200:120);P.walk+=dt*6;}
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,1100,480);ctx.save();ctx.translate(520,240);ctx.scale(5,5);ctx.translate(-P.x,-P.y);drawPlayer();ctx.restore();el('scrub').value=elapsed/dur;el('status').textContent=elapsed.toFixed(2)+' / '+dur.toFixed(2)+'s';requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></html>
